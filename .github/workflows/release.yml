name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build standalone EXE
        shell: powershell
        run: ./scripts/build-release.ps1
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repository = "${{ github.repository }}"
          $assets = @(
            "dist/VersaConvert.exe",
            "artifacts/VersaConvert-win-x64.zip",
            "artifacts/SHA256SUMS.txt"
          )
          gh release view $tag --repo $repository 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repository --clobber
          }
          else {
            gh release create $tag $assets --repo $repository --verify-tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
